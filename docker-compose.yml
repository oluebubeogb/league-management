services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-league}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-league_management}
    volumes:
      - league_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-league} -d ${POSTGRES_DB:-league_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Do NOT expose port publicly in production
    # ports:
    #   - "5432:5432"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-league}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-league_management}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PRIMARY_ADMIN_USERNAME: ${PRIMARY_ADMIN_USERNAME}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD}
      PRIMARY_ADMIN_PHONE: ${PRIMARY_ADMIN_PHONE}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1500}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_AUTO_PUBLISH: ${AI_AUTO_PUBLISH:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - internal

volumes:
  league_pgdata:

networks:
  internal:
    driver: bridge
