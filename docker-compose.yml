# Phase 1 — web only. PostgreSQL is provided by Coolify as an external service.
# Set DATABASE_URL in Coolify env to point at the Coolify Postgres hostname.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PRIMARY_ADMIN_USERNAME: ${PRIMARY_ADMIN_USERNAME}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD}
      PRIMARY_ADMIN_PHONE: ${PRIMARY_ADMIN_PHONE}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1500}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_AUTO_PUBLISH: ${AI_AUTO_PUBLISH:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FORCE_PRIMARY_ADMIN_RESET: ${FORCE_PRIMARY_ADMIN_RESET:-false}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
